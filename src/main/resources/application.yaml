
server:
  port: 8080

spring:
  application:
    name: springboot-observability

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

app:
  schedulers:
    weather:
      city: Guwahati
      fixed-delay: 60000

    exchange:
      base: USD
      target: INR
      fixed-delay: 60000      

    heartbeat:
      fixed-delay: 2000

    date-generator:
      fixed-delay: 10000