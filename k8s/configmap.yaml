apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-config
  namespace: observability
data:
  SPRING_PROFILES_ACTIVE: "default"
  SERVER_PORT: "8080"

  APP_SCHEDULERS_WEATHER_CITY: "Guwahati"
  APP_SCHEDULERS_WEATHER_FIXED_DELAY: "60000"

  APP_SCHEDULERS_EXCHANGE_BASE: "USD"
  APP_SCHEDULERS_EXCHANGE_TARGET: "INR"
  APP_SCHEDULERS_EXCHANGE_FIXED_DELAY: "60000"

  APP_SCHEDULERS_HEARTBEAT_FIXED_DELAY: "2000"

  APP_SCHEDULERS_DATE_GENERATOR_FIXED_DELAY: "10000"